# agent-gateway configuration
agent:
  model_name: "gpt-4o"
  api_key: "your_api_key"             # or set AGENT_API_KEY env var
  base_url: ""                        # optional, default: OpenAI official
  system_prompt: "You are a helpful assistant."
  max_iters: 20
  # max_context_tokens: 128000       # optional, default: 128000

session:
  # backend: "file" or "redis"
  backend: "file"
  # file backend
  dir: "./sessions"
  # redis backend
  # addr: "localhost:6379"
  # password: ""
  # db: 0

channels:
  - name: "lark-bot"
    platform: "lark"
    lark:
      app_id: "your_app_id"
      app_secret: "your_app_secret"
    # optional per-channel overrides:
    # agent:
    #   system_prompt: "你是技术支持助手。"
    # session:
    #   backend: "redis"
    #   addr: "localhost:6379"
